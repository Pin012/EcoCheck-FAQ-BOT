<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16a34a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>生態檢核FAQ系統 Ecocheck Bot</title>
    <style>
      :root {
        color-scheme: dark;
        --brand: #b9c8ba;
        --surface: #4f5d55;
        --surface-deep: #2f3834;
        --glass: rgba(255, 255, 255, 0.08);
        --glass-line: rgba(255, 255, 255, 0.14);
        --text-main: rgba(241, 245, 249, 0.96);
        --text-sub: rgba(203, 213, 225, 0.72);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
        background: var(--surface-deep);
      }

      #boot-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 24px;
        z-index: 9999;
        background:
          radial-gradient(circle at 50% 38%, rgba(188, 203, 188, 0.16), transparent 30%),
          linear-gradient(145deg, #3a463f 0%, #566258 48%, #2f3834 100%);
      }

      #boot-screen::before,
      #boot-screen::after {
        content: "";
        position: absolute;
        width: 46vmin;
        height: 46vmin;
        border-radius: 999px;
        background: rgba(190, 203, 190, 0.1);
        filter: blur(24px);
        animation: floatGlow 5.5s ease-in-out infinite alternate;
      }

      #boot-screen::before { top: 10%; left: 12%; }
      #boot-screen::after {
        right: 10%;
        bottom: 8%;
        background: rgba(160, 174, 165, 0.1);
        animation-delay: -2.2s;
      }

      .boot-panel {
        position: relative;
        z-index: 1;
        width: min(420px, 100%);
        display: grid;
        justify-items: center;
        gap: 22px;
        text-align: center;
      }

      .boot-mark {
        width: 120px;
        height: 120px;
        display: grid;
        place-items: center;
        border-radius: 34px;
        border: 1px solid var(--glass-line);
        background: var(--glass);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 28px 70px rgba(2, 19, 39, 0.28);
        backdrop-filter: blur(10px);
      }

      .spinner {
        width: 48px;
        height: 48px;
        border-radius: 999px;
        border: 5px solid rgba(226, 232, 240, 0.3);
        border-top-color: rgba(248, 250, 252, 0.95);
        border-right-color: rgba(248, 250, 252, 0.85);
        animation: spin 0.95s linear infinite;
      }

      .boot-title {
        margin: 0;
        color: var(--text-main);
        font-size: clamp(2rem, 7vw, 3rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        text-shadow: 0 12px 36px rgba(0, 0, 0, 0.2);
      }

      .boot-status {
        margin: 0;
        color: var(--text-sub);
        min-height: 1.4rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 0.86rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes floatGlow { to { transform: translate3d(18px, -14px, 0) scale(1.06); } }
    </style>
  </head>
  <body>
    <div id="boot-screen" aria-live="polite">
      <section class="boot-panel" role="status" aria-label="系統啟動中">
        <div class="boot-mark" aria-hidden="true">
          <span class="spinner"></span>
        </div>
        <h1 class="boot-title">EcoCheck</h1>
        <p class="boot-status" id="boot-status">LOADING...</p>
      </section>
    </div>

    <div id="root"></div>

    <script type="module">
      const statusEl = document.getElementById('boot-status');
      const bootScreen = document.getElementById('boot-screen');

      const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

      async function waitForApi(maxAttempts = 45) {
        for (let i = 1; i <= maxAttempts; i += 1) {
          try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 3500);
            const response = await fetch('/health', { cache: 'no-store', signal: controller.signal });
            clearTimeout(timeout);
            if (response.ok) {
              statusEl.textContent = 'ENTERING...';
              return;
            }
          } catch {}

          statusEl.textContent = 'LOADING...';
          await wait(2000);
        }

        statusEl.textContent = 'ENTERING...';
      }

      (async () => {
        await waitForApi();
        await import('/src/main.tsx');

        if (bootScreen) {
          bootScreen.style.transition = 'opacity 220ms ease';
          bootScreen.style.opacity = '0';
          setTimeout(() => bootScreen.remove(), 240);
        }
      })();
    </script>
  </body>
</html>
