<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16a34a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>生態檢核FAQ系統 Ecocheck Bot</title>
    <style>
      :root {
        color-scheme: dark;
        --brand: #0f172a;
        --surface: #0f172a;
        --surface-deep: #020617;
        --glass: rgba(255, 255, 255, 0.08);
        --glass-line: rgba(255, 255, 255, 0.14);
        --text-main: rgba(241, 245, 249, 0.96);
        --text-sub: rgba(203, 213, 225, 0.72);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
        background: var(--surface-deep);
      }

      #boot-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 24px;
        z-index: 9999;
        background:
          radial-gradient(circle at 50% 38%, rgba(148, 163, 184, 0.16), transparent 30%),
          linear-gradient(145deg, #0f172a 0%, #1e293b 48%, #020617 100%);
      }

      #boot-screen::before,
      #boot-screen::after {
        content: "";
        position: absolute;
        width: 46vmin;
        height: 46vmin;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.1);
        filter: blur(24px);
        animation: floatGlow 5.5s ease-in-out infinite alternate;
      }

      #boot-screen::before { top: 10%; left: 12%; }
      #boot-screen::after {
        right: 10%;
        bottom: 8%;
        background: rgba(30, 41, 59, 0.16);
        animation-delay: -2.2s;
      }

      .boot-panel {
        position: relative;
        z-index: 1;
        width: min(420px, 100%);
        display: grid;
        justify-items: center;
        gap: 22px;
        text-align: center;
      }

      .boot-mark {
        position: relative;
        width: 128px;
        height: 128px;
        display: grid;
        place-items: center;
      }

      .boot-mark::before {
        content: "";
        position: absolute;
        width: 104px;
        height: 104px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(45, 212, 191, 0.22), transparent 62%);
        animation: pulseGlow 2.2s ease-in-out infinite;
      }

      .boot-mark::after {
        content: "";
        position: absolute;
        width: 100px;
        height: 100px;
        border-radius: 999px;
        background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.95) 0 4px, rgba(134, 239, 172, 0.45) 5px, transparent 10px);
        animation: spin 2.8s linear infinite reverse;
      }

      .spinner {
        position: absolute;
        z-index: 1;
        width: 86px;
        height: 86px;
        border-radius: 999px;
        background:
          conic-gradient(from 90deg, transparent 0 18%, rgba(134, 239, 172, 0.92) 34%, rgba(248, 250, 252, 0.96) 52%, rgba(45, 212, 191, 0.72) 72%, transparent 92%);
        animation: spin 1.05s linear infinite;
        filter: drop-shadow(0 0 18px rgba(45, 212, 191, 0.34));
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
      }

      .boot-icon {
        position: relative;
        z-index: 2;
        width: 42px;
        height: 42px;
        object-fit: contain;
        animation: iconFloat 2.2s ease-in-out infinite;
        filter: drop-shadow(0 10px 18px rgba(2, 6, 23, 0.28));
      }

      .boot-icon {
        position: relative;
        z-index: 1;
        width: 38px;
        height: 38px;
        object-fit: contain;
        filter: drop-shadow(0 10px 18px rgba(2, 6, 23, 0.28));
      }

      .boot-title {
        margin: 0;
        color: var(--text-main);
        font-size: clamp(2rem, 7vw, 3rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        text-shadow: 0 12px 36px rgba(0, 0, 0, 0.2);
      }

      .boot-status {
        margin: 0;
        color: var(--text-sub);
        min-height: 1.4rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 0.86rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes iconFloat {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-2px) scale(1.04); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.45; transform: scale(0.86); }
        50% { opacity: 0.9; transform: scale(1.08); }
      }
      @keyframes floatGlow { to { transform: translate3d(18px, -14px, 0) scale(1.06); } }
    </style>
  </head>
  <body>
    <div id="boot-screen" aria-live="polite">
      <section class="boot-panel" role="status" aria-label="系統啟動中">
        <div class="boot-mark" aria-hidden="true">
          <span class="spinner"></span>
          <img class="boot-icon" src="/brand-icon.png" alt="" />
        </div>
        <h1 class="boot-title">EcoCheck</h1>
        <p class="boot-status" id="boot-status">LOADING...</p>
      </section>
    </div>

    <div id="root"></div>

    <script type="module">
      const statusEl = document.getElementById('boot-status');
      const bootScreen = document.getElementById('boot-screen');

      const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

      async function waitForApi(maxAttempts = 45) {
        for (let i = 1; i <= maxAttempts; i += 1) {
          try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 3500);
            const response = await fetch('/health', { cache: 'no-store', signal: controller.signal });
            clearTimeout(timeout);
            if (response.ok) {
              statusEl.textContent = 'ENTERING...';
              return;
            }
          } catch {}

          statusEl.textContent = 'LOADING...';
          await wait(2000);
        }

        statusEl.textContent = 'ENTERING...';
      }

      (async () => {
        await waitForApi();
        await import('/src/main.tsx');

        if (bootScreen) {
          bootScreen.style.transition = 'opacity 220ms ease';
          bootScreen.style.opacity = '0';
          setTimeout(() => bootScreen.remove(), 240);
        }
      })();
    </script>
  </body>
</html>
